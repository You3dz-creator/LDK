  var STEP = 22; // mỗi dòng xuống dưới lệch sang trái bấy nhiêu px => bậc thang đi lên từ trái sang phải
  var wall = document.getElementById("wall");
  function build() {
    var lh = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--lh"));
    var imgh = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--imgh"));
    var unit = imgh * (720 / 81) + 40;
    var rows = Math.ceil(window.innerHeight / lh) + 1;
    var n = Math.ceil(window.innerWidth / unit) + 3;
    var half = new Array(n + 1).join('<img class="w" alt="" src="' + SRC + '">');
    var html = "";
    for (var i = 0; i < rows; i++) html += '<div class="row"><span class="track">' + half + half + '</span></div>';
    wall.innerHTML = html;
    var tracks = wall.querySelectorAll(".track");
    for (var j = 0; j < tracks.length; j++) {
      tracks[j].style.marginLeft = (-(((j * STEP) % unit))) + "px";
    }
  }
  var pre = new Image();
  pre.onload = build;
  pre.src = SRC;
  var t;
  window.addEventListener("resize", function () { clearTimeout(t); t = setTimeout(build, 200); });
  var snd = document.getElementById("snd");
  var started = false;
  snd.loop = true;
  function go() {
    if (started) return;
    started = true;
    document.body.classList.add("on");
    try { snd.currentTime = 0; } catch (e) {}
    var p = snd.play();
    if (p && p.catch) p.catch(function () {});
  }
  document.getElementById("start").addEventListener("click", go);
</script>
